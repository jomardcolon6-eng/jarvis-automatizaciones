name: Mercados diarios
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mercados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mercados diarios y guardar mercados-diarios.md
        run: |
          python3 - <<'PY'
          import datetime, json, urllib.request
          url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true"
          with urllib.request.urlopen(url, timeout=30) as resp:
              d = json.load(resp)
          now = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=4)
          names = {"bitcoin": "Bitcoin (BTC)", "ethereum": "Ethereum (ETH)", "solana": "Solana (SOL)"}
          lines = [f"# Mercados diarios - {now:%Y-%m-%d %H:%M} AST", "", "Fuente: CoinGecko (sin clave, datos públicos)", ""]
          for k, v in d.items():
              lines.append(f"- {names[k]}: ${v['usd']:,.2f} ({v['usd_24h_change']:+.2f}% en 24h)")
          open("mercados-diarios.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("Mercados guardados")
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mercados-diarios.md
          git diff --cached --quiet || git commit -m "Actualizar mercados-diarios.md"
          git push
