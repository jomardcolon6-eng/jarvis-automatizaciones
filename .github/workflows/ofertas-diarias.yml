name: Ofertas diarias

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ofertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar RSS de Slickdeals y generar ofertas-diarias.md
        run: |
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -o feed.xml "https://slickdeals.net/newsearch.php?rss=1"
          python3 - <<'PY'
          import datetime, urllib.request, xml.etree.ElementTree as ET
          root = ET.parse('feed.xml').getroot()
          items = root.findall('.//item')[:20]
          if not items:
              print('El RSS sin busqueda no trajo ofertas; usando la busqueda amplia del mismo RSS')
              req = urllib.request.Request('https://slickdeals.net/newsearch.php?q=deal&rss=1', headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  root = ET.fromstring(resp.read())
              items = root.findall('.//item')[:20]
          if not items:
              raise SystemExit('No se encontraron ofertas en el RSS de Slickdeals')
          now = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=4)
          lines = [
              f"# Ofertas diarias - {now:%Y-%m-%d %H:%M} AST",
              '',
              'Fuente: https://slickdeals.net/newsearch.php?rss=1',
              '',
          ]
          for item in items:
              title = (item.findtext('title') or '').strip().replace('[', '(').replace(']', ')')
              link = (item.findtext('link') or '').strip()
              if title and link:
                  lines.append(f"- [{title}]({link})")
          if len(lines) <= 4:
              raise SystemExit('No se pudo extraer ninguna oferta con enlace')
          open('ofertas-diarias.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print(f"Guardadas {len(lines) - 4} ofertas en ofertas-diarias.md")
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas-diarias.md
          git diff --cached --quiet || git commit -m "Actualizar ofertas-diarias.md"
          git push
