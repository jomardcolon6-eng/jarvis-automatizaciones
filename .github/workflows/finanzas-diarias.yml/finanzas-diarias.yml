name: Finanzas diarias

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finanzas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar RSS de CNBC y generar finanzas-diarias.md
        run: |
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -o feed.xml "https://www.cnbc.com/id/100003114/device/rss/rss.html"
          python3 - <<'PY'
          import datetime, xml.etree.ElementTree as ET
          root = ET.parse('feed.xml').getroot()
          items = root.findall('.//item')[:20]
          if not items:
              raise SystemExit('No se encontraron noticias en el RSS de CNBC')
          now = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=4)
          lines = [
              f"# Finanzas diarias - {now:%Y-%m-%d %H:%M} AST",
              '',
              'Fuente: https://www.cnbc.com/id/100003114/device/rss/rss.html',
              '',
          ]
          for item in items:
              title = (item.findtext('title') or '').strip().replace('[', '(').replace(']', ')')
              link = (item.findtext('link') or '').strip()
              if title and link:
                  lines.append(f"- [{title}]({link})")
          if len(lines) <= 4:
              raise SystemExit('No se pudo extraer ningun titular con enlace')
          open('finanzas-diarias.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print(f"Guardados {len(lines) - 4} titulares en finanzas-diarias.md")
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finanzas-diarias.md
          git diff --cached --quiet || git commit -m "Actualizar finanzas-diarias.md"
          git push
