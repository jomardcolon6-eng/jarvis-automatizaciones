name: Tecnología diaria

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tecnologia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y generar tecnologia-diario.md
        run: |
          curl -fsSL -A "Mozilla/5.0" -o feed.xml https://techcrunch.com/feed/
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          tree = ET.parse('feed.xml')
          root = tree.getroot()
          items = root.findall('.//item')[:15]
          if not items:
              raise SystemExit('El RSS de TechCrunch no devolvió artículos')
          ahora = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          lines = ['# Tecnología diaria', '', f'Actualizado: {ahora} (9:30 AM AST)', '', 'Fuente: TechCrunch — https://techcrunch.com/feed/', '']
          for it in items:
              t = (it.findtext('title') or '').strip()
              l = (it.findtext('link') or '').strip()
              d = (it.findtext('pubDate') or '').strip()
              lines.append(f'- [{t}]({l})')
              if d:
                  lines.append(f'  - Publicado: {d}')
          open('tecnologia-diario.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print(f'Artículos guardados: {len(items)}')
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tecnologia-diario.md
          git diff --cached --quiet || git commit -m "Actualizar tecnologia-diario.md"
          git push
