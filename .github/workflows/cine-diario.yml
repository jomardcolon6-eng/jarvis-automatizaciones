name: Cine diario

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar RSS de The Hollywood Reporter y generar cine-diario.md
        run: |
          curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -o feed.xml "https://www.hollywoodreporter.com/feed/"
          python3 - <<'PY'
          import datetime, xml.etree.ElementTree as ET
          root = ET.parse('feed.xml').getroot()
          items = root.findall('.//item')[:20]
          if not items:
              raise SystemExit('No se encontraron noticias en el RSS de The Hollywood Reporter')
          now = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=4)
          lines = [
              f"# Cine diario - {now:%Y-%m-%d %H:%M} AST",
              '',
              'Fuente: https://www.hollywoodreporter.com/feed/',
              '',
          ]
          for item in items:
              title = (item.findtext('title') or '').strip().replace('[', '(').replace(']', ')')
              link = (item.findtext('link') or '').strip()
              if title and link:
                  lines.append(f"- [{title}]({link})")
          if len(lines) <= 4:
              raise SystemExit('No se pudo extraer ningun titular con enlace')
          open('cine-diario.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print(f"Guardados {len(lines) - 4} titulares en cine-diario.md")
          PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cine-diario.md
          git diff --cached --quiet || git commit -m "Actualizar cine-diario.md"
          git push
